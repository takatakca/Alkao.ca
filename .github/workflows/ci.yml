name: CI

on:
  pull_request:
  push:
    branches: [main]

# New pushes replace stale validations for this branch/PR.
concurrency:
  group: alkao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    # Throwaway PostgreSQL for this job only. ALKAO tests never touch staging or production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium for the Operations app end-to-end tests (test/ui).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run check:migrations
      - run: npm run check:secrets
      - name: Verify the container includes a valid Halloween catalog
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t alkao-ci .
          docker run --rm alkao-ci node --import tsx --input-type=module -e 'import { readFileSync } from "node:fs"; import { EventFile } from "./src/ops/events-import.ts"; EventFile.parse(JSON.parse(readFileSync("catalogs/havana-halloween-2026.json", "utf8"))); console.log("Container Halloween catalog is valid");'
      - run: npm test
