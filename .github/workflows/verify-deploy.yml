name: Verify deployment

# CI success does not prove that Coolify deployed. Read-only checks, without secrets.
# Run by Deploy once Coolify has queued a commit, or by hand for main's latest commit.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit alkao.ca must serve
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: alkao-verify-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Confirm live deployment commit
        env:
          DEPLOYED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED="${DEPLOYED_SHA:-$(git rev-parse HEAD)}"
          # Coolify builds the image, starts it and waits for /health/ready: allow ~10 minutes.
          for attempt in $(seq 1 20); do
            echo "Production verification attempt ${attempt}/20; expected ${EXPECTED:0:12}"
            if node --import tsx scripts/live-watch.ts --require-build --expect-build "$EXPECTED" https://alkao.ca; then
              echo "Confirmed alkao.ca is serving the expected commit."
              exit 0
            fi
            if [[ "$attempt" != 20 ]]; then sleep 30; fi
          done
          echo "::error::Cannot verify deployed commit. See the Coolify deployment log and docs/DEPLOYMENT.md."
          exit 1
